<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spese Familiari">

<title>Spese Familiari</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f3f5f7;
    color: #1d1d1f;
}

header {
    background: #087f5b;
    color: white;
    padding: 22px 18px 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 5px 0 0;
    opacity: .85;
    font-size: 13px;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 15px;
    padding-bottom: 100px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 17px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.totale {
    text-align: center;
}

.totale .numero {
    color: #087f5b;
    font-weight: 700;
    font-size: 35px;
    margin-top: 5px;
}

.riepilogo {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
    margin-top: 15px;
}

.box {
    background: #eef8f5;
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    font-size: 12px;
}

.box b {
    display: block;
    font-size: 16px;
    margin-top: 3px;
}

h2 {
    font-size: 18px;
    margin: 0 0 14px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 12px 0 5px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

button {
    width: 100%;
    border: 0;
    background: #087f5b;
    color: white;
    font-size: 16px;
    font-weight: 600;
    padding: 14px;
    margin-top: 16px;
    border-radius: 12px;
}

.movimento {
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.movimento:last-child {
    border-bottom: 0;
}

.riga {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.descrizione {
    font-weight: 600;
}

.importo {
    font-weight: 700;
    white-space: nowrap;
}

.dettagli {
    font-size: 12px;
    color: #777;
    margin-top: 4px;
}

.cancella {
    color: #d22;
    font-size: 12px;
    margin-top: 6px;
    display: inline-block;
    cursor: pointer;
}

.vuoto {
    color: #777;
    text-align: center;
    padding: 20px 5px;
}

footer {
    text-align: center;
    color: #999;
    font-size: 11px;
    padding: 15px;
}
</style>
</head>

<body>

<header>
    <h1>💶 Spese Familiari</h1>
    <p>Gestione delle spese di famiglia</p>
</header>

<main>

<div class="card totale">
    <div>Totale spese</div>
    <div class="numero" id="totale">€ 0,00</div>

    <div class="riepilogo">
        <div class="box">
            Giorgia
            <b id="totGiorgia">€ 0</b>
        </div>

        <div class="box">
            Matteo
            <b id="totMatteo">€ 0</b>
        </div>

        <div class="box">
            Famiglia
            <b id="totFamiglia">€ 0</b>
        </div>
    </div>
</div>


<div class="card">

<h2>➕ Nuova spesa</h2>

<label>Data</label>
<input type="date" id="data">

<label>Importo €</label>
<input type="number" id="importo"
       inputmode="decimal"
       step="0.01"
       placeholder="0,00">

<label>Beneficiario</label>

<select id="beneficiario">
<option>Giorgia</option>
<option>Matteo</option>
<option selected>Famiglia</option>
<option>Altro</option>
</select>


<label>Categoria</label>

<select id="categoria">
<option>Bollette</option>
<option>Bolli</option>
<option>Abbonamenti</option>
<option>Spesa</option>
<option>Scuola</option>
<option>Salute</option>
<option>Trasporti</option>
<option>Casa</option>
<option>Tempo libero</option>
<option>Altro</option>
</select>


<label>Descrizione</label>

<input type="text"
       id="descrizione"
       placeholder="Es. Netflix, ENEL, farmacia...">


<button onclick="salvaSpesa()">
Salva spesa
</button>

</div>


<div class="card">

<h2>📋 Ultimi movimenti</h2>

<div id="lista"></div>

</div>


<div class="card">

<h2>📊 Spese per categoria</h2>

<div id="categorie"></div>

</div>

</main>


<footer>
Spese Familiari · archivio locale
</footer>


<script>

let spese =
JSON.parse(localStorage.getItem("speseFamiliari")) || [];


document.getElementById("data").value =
new Date().toISOString().split("T")[0];


function euro(numero) {

return new Intl.NumberFormat(
"it-IT",
{
style:"currency",
currency:"EUR"
}
).format(numero);

}


function salvaSpesa() {

let data =
document.getElementById("data").value;

let importo =
parseFloat(
document.getElementById("importo").value
);

let beneficiario =
document.getElementById("beneficiario").value;

let categoria =
document.getElementById("categoria").value;

let descrizione =
document.getElementById("descrizione").value.trim();


if(!data || isNaN(importo) || importo <= 0) {

alert("Inserisci data e importo della spesa.");

return;

}


let spesa = {

id: Date.now(),

data: data,

importo: importo,

beneficiario: beneficiario,

categoria: categoria,

descrizione:
descrizione || categoria

};


spese.push(spesa);

salva();

document.getElementById("importo").value="";

document.getElementById("descrizione").value="";

aggiorna();

}


function elimina(id) {

if(confirm("Vuoi eliminare questa spesa?")) {

spese =
spese.filter(s => s.id !== id);

salva();

aggiorna();

}

}


function salva() {

localStorage.setItem(
"speseFamiliari",
JSON.stringify(spese)
);

}


function aggiorna() {

let totale = 0;

let giorgia = 0;

let matteo = 0;

let famiglia = 0;

let categorie = {};


spese.forEach(s => {

totale += s.importo;

if(s.beneficiario === "Giorgia")
giorgia += s.importo;

if(s.beneficiario === "Matteo")
matteo += s.importo;

if(s.beneficiario === "Famiglia")
famiglia += s.importo;


if(!categorie[s.categoria])
categorie[s.categoria] = 0;

categorie[s.categoria] += s.importo;

});


document.getElementById("totale").innerText =
euro(totale);

document.getElementById("totGiorgia").innerText =
euro(giorgia);

document.getElementById("totMatteo").innerText =
euro(matteo);

document.getElementById("totFamiglia").innerText =
euro(famiglia);



let lista =
document.getElementById("lista");

lista.innerHTML="";


if(spese.length === 0) {

lista.innerHTML =
'<div class="vuoto">Nessuna spesa registrata</div>';

}


let ordinate =
[...spese].sort(
(a,b) => new Date(b.data)-new Date(a.data)
);


ordinate.forEach(s => {

let div =
document.createElement("div");

div.className="movimento";

let data =
new Date(s.data+"T12:00:00")
.toLocaleDateString("it-IT");


div.innerHTML = `

<div class="riga">

<div class="descrizione">
${s.descrizione}
</div>

<div class="importo">
${euro(s.importo)}
</div>

</div>

<div class="dettagli">

${data} ·
${s.beneficiario} ·
${s.categoria}

</div>

<div class="cancella"
onclick="elimina(${s.id})">

Elimina

</div>

`;

lista.appendChild(div);

});


let cat =
document.getElementById("categorie");

cat.innerHTML="";


Object.entries(categorie)

.sort((a,b)=>b[1]-a[1])

.forEach(([nome,valore]) => {

let riga =
document.createElement("div");

riga.className="movimento";

riga.innerHTML = `

<div class="riga">

<div>${nome}</div>

<div class="importo">
${euro(valore)}
</div>

</div>

`;

cat.appendChild(riga);

});


}


aggiorna();

</script>

</body>
</html>
